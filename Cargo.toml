[package]
name = "chwowserver"
version = "0.1.0"
edition = "2024"
description = "CLI tool to quickly switch the realmlist.wtf of one or more World of Warcraft installations"

[[bin]]
name = "chwowserver"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6.0.0"
indexmap = "2.14.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.3"
